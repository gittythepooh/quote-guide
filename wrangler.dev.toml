# LOCAL TESTING ONLY (npx wrangler dev -c wrangler.dev.toml). Not used for deployment.
name = "fog-off-dev"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
TURNSTILE_SITEKEY = "1x00000000000000000000AA"   # Cloudflare's public always-pass TEST key

[[d1_databases]]
binding = "DB"
database_name = "fog-off-main"
database_id = "00000000-0000-0000-0000-000000000000"   # placeholder: fine for local
