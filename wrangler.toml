# The Worker keeps its technical name (it must match the Worker already deployed in Cloudflare).
name = "quote-guide"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

# Pages come from ./dist. Only /api/* runs Worker code first; everything else is static.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Sharing needs two more things (see docs/cloudflare-setup.md):
#   TURNSTILE_SITEKEY  public bot-check key, set below once the Turnstile widget exists
#   TURNSTILE_SECRET   private key, set ONLY in the Cloudflare dashboard (Settings, Variables and secrets, type Secret)
# Until both are set the share panel says sharing is not switched on yet.
[vars]
TURNSTILE_SITEKEY = "0x4AAAAAAFbUzvPAoco8zmdq"   # public site key (safe to commit)

# The database ID is not a secret. The tables create themselves on first use.
[[d1_databases]]
binding = "DB"
database_name = "fog-off-main"
database_id = "209c3486-599e-428d-b0fd-53aed7f05218"
