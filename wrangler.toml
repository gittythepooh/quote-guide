name = "quote-guide"
compatibility_date = "2026-10-01"

# Cloudflare Workers with static assets: serves the built site from ./dist.
# (_headers in dist/ is honoured. The API in functions/ is NOT served yet: see Stage 3.)
[assets]
directory = "./dist"

# Stage 3 (sharing): the API must become a Worker entry (main = "src/worker.ts") with
# run_worker_first = ["/api/*"] and a D1 binding. Run `npx wrangler d1 create quote-guide`
# and uncomment the block below with the real database_id.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "quote-guide"
# database_id = "00000000-0000-0000-0000-000000000000"
